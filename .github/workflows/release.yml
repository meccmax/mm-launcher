# Builds MM Launcher + MM Server Agent on GitHub's Windows machines and publishes a Release.
#
# How to release a new version:
#   1. Put player-facing notes in release-notes/vX.Y.Z.md (optional; GitHub writes some if missing)
#   2. Push a tag:  git tag v0.5.0 && git push origin v0.5.0
# The launcher and agent read the newest Release to offer updates, and verify every
# download against the SHA256SUMS.txt this workflow publishes alongside it.
#
# Or without pushing a tag: Actions > Release > Run workflow, and type the version
# (e.g. 0.5.0) in "Publish as version". The workflow creates the vX.Y.Z tag itself.
# Leave it empty to only build + test; the files are attached to the run instead.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish as version (e.g. 0.5.0). Empty = build and test only."
        required: false
        default: ""

# Security: the build/test job can only read the repo. Only the small publish job, which runs
# no project code, gets permission to create the Release. Third-party actions are pinned to
# exact commits (Dependabot proposes updates), so a moved tag can't change what runs here.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ github.event.inputs.release_version }}
        run: |
          $tag = "$env:REF_NAME"
          $requested = "$env:REQUESTED".Trim().TrimStart('v')
          $publish = "false"
          if ($tag -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1]; $publish = "true" }
          elseif ($requested -match '^\d+\.\d+\.\d+$') { $v = $requested; $publish = "true" }
          elseif ($requested -ne "") { Write-Error "release_version must look like 0.5.0"; exit 1 }
          else { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  (publish: $publish)"

      - name: Self-check (fake DayZ servers + engine tests)
        shell: pwsh
        run: |
          $fake = Start-Process python -ArgumentList "tools/fake_dayz_servers.py" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          dotnet run -c Release --project src/MMLauncher.Tests
          $code = $LASTEXITCODE
          Stop-Process -Id $fake.Id -ErrorAction SilentlyContinue
          exit $code

      - name: Build launcher and agent
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $p = @("-c","Release","-r","win-x64","--self-contained","true",
                 "-p:PublishSingleFile=true","-p:IncludeNativeLibrariesForSelfExtract=true",
                 "-p:EnableCompressionInSingleFile=true","-p:DebugType=None","-p:Version=$v")
          dotnet publish src/MMLauncher.App @p -o out/launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/MMServerAgent @p -o out/MMServerAgent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item agent-package/* out/MMServerAgent/

          New-Item -ItemType Directory release | Out-Null
          Copy-Item out/launcher/MMLauncher.exe release/
          Compress-Archive -Path out/MMServerAgent -DestinationPath release/MMServerAgent.zip

          # Installer (Inno Setup; preinstalled on GitHub's Windows machines, else installed here).
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=$v" "/DSourceExe=$PWD\out\launcher\MMLauncher.exe" installer\MMLauncher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $lines = Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Test the installer (silent install, check shortcuts, uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "mm-install-test"
          $p = Start-Process release\MMLauncher-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\MMLauncher.exe")) { throw "MMLauncher.exe wasn't installed" }
          $start = Join-Path ([Environment]::GetFolderPath("Programs")) "MM Launcher.lnk"
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "MM Launcher.lnk"
          if (-not (Test-Path $start)) { throw "No Start menu shortcut" }
          if (-not (Test-Path $desk)) { throw "No desktop shortcut" }
          $key = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{2DEB2730-F75A-4BE1-9EA7-9C5B68326BAE}_is1"
          Write-Host "Installed apps entry: $($key.DisplayName) $($key.DisplayVersion) in $($key.InstallLocation)"
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\MMLauncher.exe"); $i++) { Start-Sleep -Seconds 1 }
          if ((Test-Path "$dir\MMLauncher.exe") -or (Test-Path $start) -or (Test-Path $desk)) { throw "Uninstall left files or shortcuts behind" }
          Write-Host "Installer test passed."

      - name: Keep the files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mm-launcher-build
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: release-notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mm-launcher-build
          path: release/

      - name: Check the files against their checksums
        run: cd release && sha256sum -c SHA256SUMS.txt

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          notes="release-notes/$TAG.md"
          # --target: when run by hand, gh creates the tag on this exact commit.
          args=("$TAG" release/MMLauncher-Setup.exe release/MMLauncher.exe release/MMServerAgent.zip release/SHA256SUMS.txt
                --title "MM Launcher $TAG" --target "$SHA")
          if [ -f "$notes" ]; then gh release create "${args[@]}" --notes-file "$notes"
          else gh release create "${args[@]}" --generate-notes; fi
